# IXIN OS — Windows dans le menu de démarrage (lu par grub-mkconfig après /etc/default/grub)
#
# L'entrée « Windows » d'IXIN (/etc/grub.d/26_ixin_windows) démarre Windows par le firmware,
# comme sans IXIN : BitLocker ne demande pas sa clé de récupération. os-prober ne l'ajoute donc
# pas une seconde fois, et les entrées « (EFI BootNext) » de GRUB, qui reprennent toutes les
# entrées du firmware (réseau, outils…), sont désactivées.
GRUB_DISABLE_BOOTNEXT=true
GRUB_OS_PROBER_SKIP_LIST="${GRUB_OS_PROBER_SKIP_LIST:+$GRUB_OS_PROBER_SKIP_LIST }$(/usr/lib/ixin/ixin-grub-windows --skip-list 2>/dev/null || true)"
