# IXIN Update — réglages par défaut (ne pas modifier ce fichier).
# Pour changer un réglage, créez /etc/ixin/update.conf avec la même section [update]
# ou utilisez le Centre IXIN (onglet « Mises à jour »).
[update]
# auto   : installe tout seul (sécurité tout de suite, le reste au plus une fois par jour)
# notify : recherche et prévient seulement
# manual : aucune action automatique
mode = auto
check_interval_hours = 4
install_interval_hours = 24
# Point de restauration Btrfs (Timeshift) avant chaque mise à jour
snapshots = yes
snapshots_keep = 5
# Mettre aussi à jour les applications Flatpak
flatpak = yes
# Mises à jour non urgentes : seulement sur secteur, pas pendant un jeu,
# pas sur une connexion limitée (forfait mobile)
require_ac = yes
min_battery = 40
defer_while_gaming = yes
respect_metered = yes
# Reporter les mises à jour non urgentes si une annonce Arch Linux récente
# (intervention manuelle possible) n'a pas encore été validée par l'équipe IXIN
arch_news_check = yes
arch_news_grace_days = 3
# Politique signée de l'équipe IXIN (mise à jour urgente, blocages, annonces)
policy_url = https://github.com/hashcat-max/IXIN-GROUP/releases/download/repo/policy.json
