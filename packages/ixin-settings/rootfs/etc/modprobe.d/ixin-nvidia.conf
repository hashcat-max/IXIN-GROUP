# (dans /etc/modprobe.d pour ne pas reconstruire l'initramfs à chaque mise à jour des réglages IXIN ;
#  il sera intégré à la prochaine mise à jour du noyau)
# Wayland + NVIDIA : KMS et conservation de la mémoire vidéo en veille
options nvidia_drm modeset=1 fbdev=1
options nvidia NVreg_PreserveVideoMemoryAllocations=1
