# IXIN OS — écran de connexion (thème Breeze aux couleurs IXIN, voir ixin-artwork).
# SDDM lit ce dossier par ordre alphabétique et le fichier default.conf du paquet sddm
# remet le thème à vide : ce fichier doit rester classé APRÈS lui (d'où « zz- »).
# Un réglage dans /etc/sddm.conf.d/ reste prioritaire.
[Theme]
Current=breeze
CursorTheme=breeze_cursors

[Users]
MaximumUid=60513
MinimumUid=1000
