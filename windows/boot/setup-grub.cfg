# ═══════════════════════════════════════════════════════════════════════════
#  IXIN OS Setup — menu de démarrage de l'installation lancée depuis Windows
#
#  Intégré à grubx64.efi (tools/build-windows-boot.sh), que IXIN OS Setup copie
#  dans la partition EFI de Windows (\EFI\IXIN-SETUP\). Démarre l'ISO d'IXIN OS
#  rangée dans la partition exFAT « IXIN-SETUP » préparée par IXIN OS Setup.
# ═══════════════════════════════════════════════════════════════════════════
set timeout=8
set default=0
set menu_color_normal=light-gray/black
set menu_color_highlight=black/light-green

insmod part_gpt
insmod part_msdos
insmod fat
insmod exfat
insmod ntfs
insmod iso9660
insmod loopback
insmod linux
insmod chain
insmod search
insmod search_label
insmod search_fs_file
insmod test
insmod echo
insmod sleep
insmod all_video
insmod gfxterm
insmod font

if loadfont unicode; then
    set gfxmode=auto
    terminal_output gfxterm
fi

# Options choisies dans IXIN OS Setup (options.cfg, écrit à côté de ce chargeur) : partition EFI
# à utiliser (ixin.esp=…), IXIN-SETUP à garder (ixin.keepsetup=1)… transmises au système
# d'installation par la ligne de commande du noyau. Exportées : les entrées du menu les voient.
set ixin_options=""
if [ -f "${cmdpath}/options.cfg" ]; then
    source "${cmdpath}/options.cfg"
fi
export ixin_options

search --no-floppy --label --set=ixinsetup IXIN-SETUP

if [ -n "${ixinsetup}" -a -f "(${ixinsetup})/ixin-os.iso" ]; then
    loopback ixinloop "(${ixinsetup})/ixin-os.iso"

    menuentry "Installer IXIN OS (à côté de Windows)" --class ixin --id ixin-setup {
        echo "Chargement d'IXIN OS…"
        linux (ixinloop)/ixin/boot/x86_64/vmlinuz-linux-zen archisobasedir=ixin img_label=IXIN-SETUP img_loop=/ixin-os.iso lsm=landlock,lockdown,yama,integrity,apparmor,bpf nvidia_drm.modeset=1 quiet loglevel=3 ixin.setup=windows ${ixin_options}
        initrd (ixinloop)/ixin/boot/x86_64/initramfs-linux-zen.img
    }

    menuentry "Installer IXIN OS — mode compatibilité graphique" --class ixin --id ixin-setup-safe {
        linux (ixinloop)/ixin/boot/x86_64/vmlinuz-linux-zen archisobasedir=ixin img_label=IXIN-SETUP img_loop=/ixin-os.iso lsm=landlock,lockdown,yama,integrity,apparmor,bpf nvidia_drm.modeset=1 nomodeset ixin.setup=windows ${ixin_options}
        initrd (ixinloop)/ixin/boot/x86_64/initramfs-linux-zen.img
    }
else
    menuentry "Fichiers d'installation introuvables — relancez IXIN OS Setup depuis Windows" --class error {
        echo "La partition IXIN-SETUP ou le fichier ixin-os.iso est introuvable."
        echo "Redémarrez sur Windows et relancez IXIN OS Setup."
        sleep 15
    }
fi

menuentry "Revenir à Windows" --class windows --id windows {
    search --no-floppy --file --set=winesp /EFI/Microsoft/Boot/bootmgfw.efi
    chainloader "(${winesp})/EFI/Microsoft/Boot/bootmgfw.efi"
}

menuentry "Paramètres du firmware (UEFI / BIOS)" --class settings {
    fwsetup
}
