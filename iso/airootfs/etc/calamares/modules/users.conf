---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - wheel
    - audio
    - video
    - input
    - storage
    - network
    - lp
    - optical
    - gamemode
autologinGroup:  autologin
doAutologin:     false
sudoersGroup:    wheel
sudoersConfigureWithGroup: true
setRootPassword: false
doReusePassword: true
passwordRequirements:
    nonempty: true
    minLength: 8
    maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: false
user:
  shell: /bin/bash
  forbidden_names: [ root, liveuser ]
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "ixin-${cpu}"
  forbidden_names: [ localhost ]
presets:
    fullName:
        editable: true
