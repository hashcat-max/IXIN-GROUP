---
overwrite: false
prefer_grub_d: false
keep_distributor: false
kernel_params: [ "quiet", "splash", "loglevel=3", "lsm=landlock,lockdown,yama,integrity,apparmor,bpf", "nvidia_drm.modeset=1" ]
defaults:
    GRUB_TIMEOUT: 5
    GRUB_DEFAULT: "saved"
    GRUB_SAVEDEFAULT: true
    GRUB_DISABLE_SUBMENU: true
    GRUB_TERMINAL_OUTPUT: "gfxterm"
    GRUB_DISABLE_RECOVERY: true
    # Détection de Windows pour le dual-boot
    GRUB_DISABLE_OS_PROBER: false
    GRUB_THEME: "/usr/share/grub/themes/ixin/theme.txt"
    GRUB_GFXMODE: "auto"
always_use_defaults: true
