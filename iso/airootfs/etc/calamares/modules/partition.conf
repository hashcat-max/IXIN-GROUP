---
# Partition EFI : uniquement le chargeur GRUB (quelques Mo). Les noyaux sont sur une
# partition /boot séparée (voir partitionLayout), ce qui permet de réutiliser la partition
# EFI de Windows, souvent de 100 Mo seulement, lors d'une installation à côté de Windows.
efi:
    mountPoint:         "/boot/efi"
    recommendedSize:    512MiB
    minimumSize:        32MiB
    label:              "EFI"
userSwapChoices:
    - none      # zram est activé par défaut
    - small
    - suspend
    - file
# /boot est sur la partition EFI (non chiffrée) : GRUB ne lit jamais le volume chiffré.
# Le système est donc chiffré en LUKS2 (argon2id), déverrouillé par l'initramfs (écran Plymouth).
luksGeneration: luks2
enableLuksAutomatedPartitioning: true
drawNestedPartitions:   false
alwaysShowPartitionLabels: true
# « À côté de Windows » est proposé automatiquement si Windows est détecté
initialPartitioningChoice: alongside
initialSwapChoice: none
defaultFileSystemType:  "btrfs"
availableFileSystemTypes:  ["btrfs", "ext4", "xfs"]
essentialMounts: [ "live-*", "control", "ventoy" ]
lvm:
    enable: true

# Disposition créée par l'installation automatique (disque entier, à côté de Windows,
# remplacement ou espace libre) : /boot non chiffré (lisible par GRUB) + système, chiffré
# si l'utilisateur le demande. La partition EFI est ajoutée automatiquement si besoin.
partitionLayout:
    - name: "IXIN-BOOT"
      filesystem: "ext4"
      noEncrypt: true
      mountPoint: "/boot"
      size: 1G
    - name: "IXIN"
      filesystem: "unknown"
      mountPoint: "/"
      size: 100%
