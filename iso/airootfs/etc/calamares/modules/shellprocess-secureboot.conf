# Secure Boot : remplace le GRUB non signé posé par le module bootloader par la chaîne signée
# (shim → GRUB d'IXIN → noyau signé) et en fait l'entrée « IXIN OS » du firmware.
# Sans le paquet ixin-secureboot (construction sans clé Secure Boot) ou en mode BIOS : rien à faire.
---
dontChroot: false
timeout: 300
script:
    - command: "if [ -x /usr/lib/ixin/ixin-secureboot ] && [ -d /sys/firmware/efi ]; then /usr/lib/ixin/ixin-secureboot install; fi"
      timeout: 300
