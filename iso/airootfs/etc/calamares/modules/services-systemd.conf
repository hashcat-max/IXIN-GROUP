---
units:
  - name: "NetworkManager"
    action: "enable"
  - name: "sddm"
    action: "enable"
  - name: "bluetooth"
    action: "enable"
  - name: "systemd-resolved"
    action: "enable"
  - name: "systemd-timesyncd"
    action: "enable"
  - name: "power-profiles-daemon"
    action: "enable"
  - name: "apparmor"
    action: "enable"
  - name: "ufw"
    action: "enable"
  - name: "fstrim.timer"
    action: "enable"
  - name: "paccache.timer"
    action: "enable"
  - name: "graphical.target"
    action: "set-default"
