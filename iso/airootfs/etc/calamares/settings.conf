# IXIN OS — Calamares
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id:     prepare
  module: shellprocess
  config: shellprocess-prepare.conf
- id:     finalize
  module: shellprocess
  config: shellprocess-finalize.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksopenswaphookcfg
  - removeuser
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - shellprocess@prepare
  - initcpiocfg
  - shellprocess@finalize
  - initcpio
  - services-systemd
  - grubcfg
  - bootloader
  - umount
- show:
  - finished

branding: ixin
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false
