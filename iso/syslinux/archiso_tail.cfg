LABEL existing
TEXT HELP
Démarrer le système déjà installé (ex. Windows).
Press TAB to edit the disk and partition number to boot.
ENDTEXT
MENU LABEL Démarrer le système existant (Windows…)
COM32 chain.c32
APPEND hd0 0

# https://www.memtest.org/
LABEL memtest
MENU LABEL Test de la mémoire (Memtest86+)
LINUX /boot/memtest86+/memtest

# https://wiki.syslinux.org/wiki/index.php/Hdt_(Hardware_Detection_Tool)
LABEL hdt
MENU LABEL Informations matériel (HDT)
COM32 hdt.c32
APPEND modules_alias=hdt/modalias.gz pciids=hdt/pciids.gz

LABEL reboot
TEXT HELP
Reboot computer.
The computer's firmware must support APM.
ENDTEXT
MENU LABEL Redémarrer
COM32 reboot.c32

LABEL poweroff
TEXT HELP
Power off computer.
The computer's firmware must support APM.
ENDTEXT
MENU LABEL Éteindre
COM32 poweroff.c32
