LABEL ixin
TEXT HELP
Démarrer IXIN OS en mode live. Vous pourrez l'installer depuis le bureau.
ENDTEXT
MENU LABEL IXIN OS — Live / Installation
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% lsm=landlock,lockdown,yama,integrity,apparmor,bpf nvidia_drm.modeset=1 quiet loglevel=3

LABEL ixinram
TEXT HELP
Copie le système en mémoire vive : plus rapide, la clé USB peut être retirée.
ENDTEXT
MENU LABEL IXIN OS — Live chargé en RAM
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% lsm=landlock,lockdown,yama,integrity,apparmor,bpf nvidia_drm.modeset=1 quiet loglevel=3 copytoram

LABEL ixinsafe
TEXT HELP
À utiliser si l'écran reste noir (anciennes cartes graphiques).
ENDTEXT
MENU LABEL IXIN OS — Mode compatibilité graphique
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% lsm=landlock,lockdown,yama,integrity,apparmor,bpf nvidia_drm.modeset=1 nomodeset
