title    IXIN OS — Live chargé en RAM (plus rapide, clé retirable)
sort-key 02-ixin-ram
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% lsm=landlock,lockdown,yama,integrity,apparmor,bpf nvidia_drm.modeset=1 quiet loglevel=3 copytoram
