# IXIN OS — pacman.conf utilisé pour construire l'ISO
[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 8
Color
ILoveCandy
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# Paquets construits localement par build.sh (Calamares, outils IXIN)
[ixin-local]
SigLevel = Optional TrustAll
Server = file://@LOCALREPO@

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# Chaotic-AUR : paquets AUR précompilés (Heroic, ProtonUp-Qt, Bottles, yay…)
[chaotic-aur]
Include = /etc/pacman.d/chaotic-mirrorlist
