name: Installeur Windows (IXIN OS Setup)

# Construit IXIN-OS-Setup.exe (installation d'IXIN OS à côté de Windows) et le teste sur un
# vrai Windows : préparation complète puis annulation sur un disque virtuel (VHDX), et
# création / suppression d'une entrée de démarrage du firmware. Réutilisé par la construction
# de l'ISO pour joindre IXIN-OS-Setup.exe à chaque version publiée.

on:
  push:
    paths:
      - "windows/**"
      - "tools/build-windows-boot.sh"
      - "tools/build-vm-engine.sh"
      - ".github/workflows/windows-setup.yml"
  pull_request:
    paths:
      - "windows/**"
      - "tools/build-windows-boot.sh"
      - "tools/build-vm-engine.sh"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  boot:
    name: Chargeur de démarrage (GRUB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construire grubx64.efi (conteneur Arch Linux)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/src archlinux:latest bash -c '
            set -e
            pacman -Sy --noconfirm --needed grub >/dev/null
            /src/tools/build-windows-boot.sh /src/build/windows-boot'
          sudo chown -R "$USER" build
      - uses: actions/upload-artifact@v4
        with:
          name: windows-boot
          path: build/windows-boot/

  vm-engine:
    name: Moteur de la machine virtuelle IXIN (QEMU pour Windows)
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: zip
      - name: Assembler le moteur (QEMU de MSYS2, réduit au nécessaire)
        run: tools/build-vm-engine.sh "$(cygpath -u "$RUNNER_TEMP")/vm-engine"
      - uses: actions/upload-artifact@v4
        with:
          name: ixin-vm-engine
          path: ${{ runner.temp }}/vm-engine/

  setup:
    name: IXIN-OS-Setup.exe (compilation + auto-test sur ${{ matrix.os }})
    needs: [boot, vm-engine]
    # Deux générations de Windows : Server 2022 (noyau de Windows 10 21H2) et Server 2025 (Windows 11 24H2)
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-boot
          path: build/windows-boot
      - uses: actions/download-artifact@v4
        with:
          name: ixin-vm-engine
          path: ${{ runner.temp }}/vm-engine
      - name: Compiler
        run: dotnet build windows/IxinSetup/IxinSetup.csproj -c Release -nologo
      - name: Auto-test sur disque virtuel (préparation + annulation)
        shell: powershell
        run: |
          $exe = Resolve-Path "windows/IxinSetup/bin/Release/net462/IXIN-OS-Setup.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test", "$env:RUNNER_TEMP\ixin-selftest" -Wait -PassThru -NoNewWindow
          Write-Host "---- journal ----"
          Get-Content "$env:ProgramData\IXIN\setup.log" -Encoding UTF8 -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "Auto-test échoué (code $($p.ExitCode))" }
      - name: Test de l'entrée de démarrage du firmware (machine jetable)
        shell: powershell
        run: |
          $exe = Resolve-Path "windows/IxinSetup/bin/Release/net462/IXIN-OS-Setup.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test-boot-entry" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "Test de l'entrée de démarrage échoué (code $($p.ExitCode))" }
      - name: Machine virtuelle IXIN (moteur, disque virtuel, raccourci, démarrage du PC virtuel)
        shell: powershell
        run: |
          $exe = Resolve-Path "windows/IxinSetup/bin/Release/net462/IXIN-OS-Setup.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test-vm", "$env:RUNNER_TEMP\vm-engine\ixin-vm-engine-win64.zip" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "Test de la machine virtuelle échoué (code $($p.ExitCode))" }
      - name: Informations sur la machine de test
        if: always()
        shell: powershell
        run: |
          $exe = Resolve-Path "windows/IxinSetup/bin/Release/net462/IXIN-OS-Setup.exe"
          Start-Process -FilePath $exe -ArgumentList "--facts" -Wait -NoNewWindow
      - name: Captures d'écran (données d'exemple, pour le site et la documentation)
        continue-on-error: true
        shell: powershell
        run: |
          $exe = Resolve-Path "windows/IxinSetup/bin/Release/net462/IXIN-OS-Setup.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--screenshots", "$env:RUNNER_TEMP\captures" -Wait -PassThru -NoNewWindow
          Get-ChildItem "$env:RUNNER_TEMP\captures" | Format-Table Name, Length
          if ($p.ExitCode -ne 0) { throw "Captures d'écran : échec (code $($p.ExitCode))" }
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-2025'
        with:
          name: ixin-os-setup
          path: windows/IxinSetup/bin/Release/net462/IXIN-OS-Setup.exe
      - uses: actions/upload-artifact@v4
        if: always() && matrix.os == 'windows-2025'
        with:
          name: ixin-os-setup-captures
          path: ${{ runner.temp }}/captures
          if-no-files-found: ignore
