name: Construire l'ISO IXIN OS

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publier l'ISO dans une Release GitHub"
        type: boolean
        default: true
      allow_unsigned:
        description: "Test uniquement : construire sans clé de signature (IXIN Update n'acceptera pas les mises à jour IXIN)"
        type: boolean
        default: false
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  windows-setup:
    # IXIN-OS-Setup.exe (installation depuis Windows), construit et testé avant l'ISO :
    # une version publiée est immuable, tout doit y être joint dès sa création.
    uses: ./.github/workflows/windows-setup.yml

  iso:
    needs: windows-setup
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # versions des paquets IXIN calculées depuis l'historique git

      - name: Libérer de l'espace disque
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo docker image prune --all --force || true
          sudo mkdir -p /mnt/ixin && sudo chown "$USER" /mnt/ixin
          df -h / /mnt

      - name: Construire l'ISO dans un conteneur Arch Linux
        env:
          IXIN_SIGNING_KEY: ${{ secrets.IXIN_SIGNING_KEY }}
          IXIN_SIGNING_KEY_PASSPHRASE: ${{ secrets.IXIN_SIGNING_KEY_PASSPHRASE }}
          IXIN_ALLOW_UNSIGNED: ${{ inputs.allow_unsigned && '1' || '0' }}
        run: |
          if [ -z "$IXIN_SIGNING_KEY" ] && [ "$IXIN_ALLOW_UNSIGNED" != 1 ]; then
            echo "::error::Secret IXIN_SIGNING_KEY manquant — voir docs/MISES-A-JOUR.md, « Créer la clé de signature »"
            exit 1
          fi
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE":/src -v /mnt/ixin:/mnt/ixin \
            -e BUILD_DIR=/mnt/ixin/build -e OUT_DIR=/mnt/ixin/out \
            -e IXIN_SIGNING_KEY -e IXIN_SIGNING_KEY_PASSPHRASE -e IXIN_ALLOW_UNSIGNED \
            archlinux:latest bash -c '
              set -e
              sed -i "s/^#ParallelDownloads.*/ParallelDownloads = 10/" /etc/pacman.conf
              pacman-key --init && pacman-key --populate archlinux
              pacman -Syu --noconfirm
              cd /src && ./build.sh'
          sudo rm -rf /mnt/ixin/build
          sudo chown -R "$USER" /mnt/ixin/out
          ls -lh /mnt/ixin/out

      - name: Découper l'ISO (limite GitHub de 2 Go par fichier)
        run: |
          cd /mnt/ixin/out
          ISO=$(ls ixin-os-*.iso)
          echo "ISO=$ISO" >> "$GITHUB_ENV"
          split -b 1900M -d -a 2 "$ISO" "$ISO.part"
          ls -lh

      - name: Récupérer IXIN-OS-Setup.exe
        if: startsWith(github.ref, 'refs/tags/') || inputs.release
        uses: actions/download-artifact@v4
        with:
          name: ixin-os-setup
          path: /mnt/ixin/out

      - name: Publier la Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd /mnt/ixin/out
          TAG="${GITHUB_REF_NAME}"
          [[ "$GITHUB_REF" == refs/tags/* ]] || TAG="build-$(date +%Y.%m.%d)-${GITHUB_RUN_NUMBER}"
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          ## IXIN OS — ${ISO}

          ### Installer à côté de Windows (le plus simple)
          Téléchargez **IXIN-OS-Setup.exe** ci-dessous et lancez-le sous Windows 10 ou 11 : il vérifie le PC,
          télécharge IXIN OS, prépare l'espace sur le disque et redémarre sur l'installation (sans clé USB).
          Windows reste installé. Guide : https://github.com/${GITHUB_REPOSITORY}/blob/HEAD/docs/INSTALLATION-WINDOWS.md
          Si Windows affiche « Windows a protégé votre ordinateur » : **Informations complémentaires → Exécuter quand même**
          (le programme n'est pas encore signé ; son code source est dans le dossier windows/ du dépôt).

          ### Clé USB, machine virtuelle ou disque entier
          Le plus simple : téléchargez l'ISO en un seul fichier sur https://os.ixin.online/telecharger et suivez le
          guide pas à pas : https://github.com/${GITHUB_REPOSITORY}/blob/HEAD/docs/INSTALLATION-CLE-USB.md

          Ici, l'ISO est découpée en morceaux de 1,9 Go (limite GitHub). Pour la reconstituer :

          **Linux / macOS**
          \`\`\`
          cat ${ISO}.part* > ${ISO}
          sha256sum -c ${ISO}.sha256
          \`\`\`

          **Windows (PowerShell / cmd)**
          \`\`\`
          cmd /c copy /b ${ISO}.part00+${ISO}.part01+${ISO}.part02 ${ISO}
          \`\`\`
          (ajoutez les morceaux suivants s'il y en a plus), puis gravez l'ISO sur une clé USB avec Rufus (mode GPT/UEFI) ou Ventoy.

          Une fois installé, IXIN OS se met à jour tout seul (IXIN Update) : correctifs de sécurité
          immédiatement, point de restauration avant chaque mise à jour.
          NOTES
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "IXIN OS $TAG" --notes-file "$RUNNER_TEMP/notes.md" \
            "$ISO".part* "$ISO.sha256" IXIN-OS-Setup.exe

  site:
    # Flux du site os.ixin.online (nouvelle version, tailles, SHA-256) publié aussitôt la version créée
    needs: iso
    if: startsWith(github.ref, 'refs/tags/') || inputs.release
    uses: ./.github/workflows/publish-repo.yml
    secrets: inherit
    permissions:
      contents: write
      pages: write
      id-token: write
