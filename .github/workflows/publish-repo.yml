name: Publier les mises à jour IXIN

# Construit, signe et publie le dépôt [ixin] (paquets IXIN + politique IXIN Update).
# Tous les PC IXIN OS le consultent automatiquement : une modification fusionnée dans
# packages/ ou repo/policy.json arrive chez les utilisateurs en quelques heures
# (dans l'heure si la politique est marquée « urgent »).
#
# Publie aussi le flux du site os.ixin.online (site/ixin-os.json : version, téléchargements,
# nouveautés, guides, captures — tools/prepare-site-feed.py), à chaque version et à chaque
# modification de docs/, puis prévient le site (Cloudflare) si ses secrets sont configurés.
#
# Hébergement : les versions publiées (« releases ») de ce dépôt GitHub sont immuables, on ne
# peut pas y remplacer des fichiers ; le dépôt [ixin], qui change à chaque publication, est donc
# servi par :
#   - GitHub Pages (principal)   https://hashcat-max.github.io/IXIN-GROUP/repo
#   - la branche ixin-repo        https://raw.githubusercontent.com/hashcat-max/IXIN-GROUP/ixin-repo/repo
#     (secours ; un seul commit, remplacé à chaque publication)
# Les PC essaient ces adresses dans cet ordre (ixin-mirrorlist, policy_url d'IXIN Update).

on:
  push:
    paths:
      - "packages/**"
      - "repo/policy.json"
      - "tools/build-packages.sh"
      - "tools/prepare-site-feed.py"
      - "docs/**"
      - ".github/workflows/publish-repo.yml"
  workflow_dispatch:
  # Appelé par « Construire l'ISO » après chaque version publiée : flux du site à jour
  workflow_call:
  schedule:
    # Chaque lundi : nouvelle signature de la politique (valable 14 jours)
    - cron: "17 4 * * 1"

permissions:
  contents: write   # branche ixin-repo
  pages: write      # GitHub Pages
  id-token: write   # déploiement GitHub Pages

concurrency:
  group: publish-repo
  cancel-in-progress: false

jobs:
  publish:
    # Seule la branche principale publie vers les PC des utilisateurs.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      pages: ${{ steps.pages.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # la version de chaque paquet vient de l'historique git

      - name: Vérifier la clé de signature
        id: key
        env:
          IXIN_SIGNING_KEY: ${{ secrets.IXIN_SIGNING_KEY }}
        run: |
          if [ -z "$IXIN_SIGNING_KEY" ]; then
            msg="Secret IXIN_SIGNING_KEY manquant : rien n'est publié — voir docs/MISES-A-JOUR.md, « Créer la clé de signature »"
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then echo "::error::$msg"; exit 1; fi
            echo "::warning::$msg"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Récupérer le dépôt déjà publié (versions inchangées réutilisées telles quelles)
        if: steps.key.outputs.skip != 'true'
        run: |
          mkdir -p prev
          if git fetch -q --depth=1 origin ixin-repo 2>/dev/null; then
            git archive FETCH_HEAD repo | tar -x -C prev --strip-components=1 || true
          fi
          ls -1 prev

      - name: Construire et signer (conteneur Arch Linux)
        if: steps.key.outputs.skip != 'true'
        env:
          IXIN_SIGNING_KEY: ${{ secrets.IXIN_SIGNING_KEY }}
          IXIN_SIGNING_KEY_PASSPHRASE: ${{ secrets.IXIN_SIGNING_KEY_PASSPHRASE }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/src \
            -e IXIN_SIGNING_KEY -e IXIN_SIGNING_KEY_PASSPHRASE -e IXIN_REUSE_DIR=/src/prev \
            archlinux:latest bash -c '
              set -e
              pacman-key --init >/dev/null && pacman-key --populate archlinux >/dev/null
              pacman -Syu --noconfirm --needed base-devel git sudo >/dev/null
              cd /src && tools/build-packages.sh /src/out-repo'
          sudo chown -R "$USER" out-repo prev
          ls -l out-repo

      - name: Préparer le site du dépôt
        id: site
        if: steps.key.outputs.skip != 'true'
        run: tools/prepare-repo-site.sh out-repo prev "$RUNNER_TEMP/site"

      - name: Flux du site os.ixin.online (version, téléchargements, nouveautés, guides)
        if: steps.key.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/prepare-site-feed.py "$RUNNER_TEMP/site"

      - name: Publier sur la branche ixin-repo
        if: steps.key.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Dépôt git séparé (hors du site : GitHub Pages ne doit pas recevoir de dossier .git)
          export GIT_DIR="$RUNNER_TEMP/ixin-repo.git" GIT_WORK_TREE="$RUNNER_TEMP/site"
          git init -q -b ixin-repo
          git add -A
          serial="$(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/site/repo/policy.json'))['serial'])")"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Dépôt [ixin] — politique ${serial} (${GITHUB_SHA::7})"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ixin-repo

      - name: GitHub Pages activé ?
        id: pages
        if: steps.key.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null || true)"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          {
            echo "### Dépôt [ixin] publié"
            ls -1 out-repo/*.pkg.tar.zst | xargs -n1 basename | sed 's/^/- /'
            python3 -c "import json;p=json.load(open('out-repo/policy.json'));print(f\"- politique : serial {p['serial']}, urgent={p['urgent']}, hold={p['hold']}\")"
            echo "- branche de secours : https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/ixin-repo/repo"
          } >> "$GITHUB_STEP_SUMMARY"
          case "$mode" in
            workflow) echo "- GitHub Pages : déploiement en cours (job « pages »)" >> "$GITHUB_STEP_SUMMARY" ;;
            legacy)   echo "- GitHub Pages : publié depuis une branche (doit être ixin-repo, dossier racine)" >> "$GITHUB_STEP_SUMMARY" ;;
            *)
              msg="GitHub Pages n'est pas activé : les PC utilisent l'adresse de secours (raw.githubusercontent.com), limitée par GitHub. À activer une fois : Settings → Pages → Source : « GitHub Actions » (docs/MISES-A-JOUR.md)."
              echo "::warning::$msg"
              echo "- ⚠️ $msg" >> "$GITHUB_STEP_SUMMARY" ;;
          esac

      - name: Préparer le déploiement GitHub Pages
        if: steps.pages.outputs.mode == 'workflow'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  pages:
    needs: publish
    if: needs.publish.outputs.pages == 'workflow'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  site:
    # Prévient le site os.ixin.online que le flux a changé (facultatif : secrets du dépôt,
    # voir docs/SITE.md). Sans secret, le site relit le flux de lui-même (cache de quelques minutes).
    needs: pages
    runs-on: ubuntu-latest
    steps:
      - name: Vider le cache Cloudflare et lancer la mise à jour du site
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$CF_TOKEN$CF_HOOK" ]; then
            echo "Aucun secret Cloudflare : rien à prévenir (docs/SITE.md)"
            exit 0
          fi
          if [ -n "$CF_HOOK" ]; then
            curl -fsS -X POST "$CF_HOOK" -o /dev/null && echo "Mise à jour du site lancée (deploy hook)"
          fi
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ZONE" ]; then
            curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache" \
              -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              --data '{"hosts":["os.ixin.online"]}' | python3 -c "import json,sys; r=json.load(sys.stdin); print('Cache Cloudflare vidé' if r.get('success') else r); sys.exit(0 if r.get('success') else 1)"
          fi
